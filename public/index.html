<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEMS · Evidence Training Simulator</title>
<style>
:root{font:16px system-ui,sans-serif;color:#13243a;background:#eef2f5;--navy:#102139;--ink:#13243a;--muted:#4e6075;--line:#d9e1e8;--teal:#006b65}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #008f83;outline-offset:3px}[hidden]{display:none!important}
.shell{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}
aside{background:var(--navy);color:white;padding:30px 18px;display:flex;flex-direction:column;gap:34px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.mark{display:grid;place-items:center;width:43px;height:43px;border:1px solid #5c8b94;border-radius:10px;background:#193b4a;color:#96e3d7;font-weight:800;flex:none}.brand strong{display:block;font-size:1.35rem;letter-spacing:.09em}.brand small{display:block;color:#b2c3d6;font-size:.76rem}
nav{display:grid;gap:6px}nav button{border:0;border-left:3px solid transparent;border-radius:5px;text-align:left;background:none;color:#d5e0ed;padding:12px 10px;font-size:.91rem}nav button:hover,nav button[aria-current=page]{border-left-color:#7fe1ce;background:#233a52;color:white}
.aside-case{margin-top:auto;border-top:1px solid #34465d;padding:18px 8px 0;color:#c4d3e3;font-size:.85rem}.aside-case strong{display:block;color:white;margin-top:5px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px clamp(18px,4vw,52px);background:white;border-bottom:1px solid var(--line)}.review{color:#155950;background:#e1f4ef;border-radius:4px;padding:7px 10px;font-size:.83rem;font-weight:700}
main{padding:32px clamp(18px,4vw,52px) 50px;max-width:1380px;margin:auto}h1{font-size:clamp(1.85rem,4vw,2.6rem);letter-spacing:-.045em;margin:0 0 8px}h2{font-size:1.16rem;margin:0 0 12px}p{line-height:1.55;margin:0 0 12px}.muted{color:var(--muted)}.intro{margin-bottom:24px}.hero{background:#172d47;border-radius:12px;padding:26px;color:white;margin-bottom:18px;border-left:4px solid #72cbbc}.hero p{color:#d8e5f1;max-width:710px}.case-id{font:700 .8rem ui-monospace,monospace;letter-spacing:.12em;color:#93e2d5;margin-bottom:12px}.hero h2{font-size:1.65rem}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:white;border:1px solid var(--line);padding:20px;border-radius:10px}.card p:last-child{margin-bottom:0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:0 0 16px}
.btn{background:white;color:var(--ink);border:1px solid #b4c4d1;border-radius:6px;padding:8px 12px;font-weight:650;font-size:.875rem}.btn:hover{background:#e9f3f4}.primary,.btn[aria-pressed=true]{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover,.btn[aria-pressed=true]:hover{background:#005650}.pill{display:inline-block;background:#e8eff6;color:#314c67;padding:4px 8px;border-radius:4px;font-size:.82rem;font-weight:650}.record{background:white;border:1px solid var(--line);border-radius:9px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:570px}caption{text-align:left;font-weight:750;padding:16px}th,td{text-align:left;padding:12px 16px;border-top:1px solid var(--line)}th{color:#40546c;background:#f6f8fa;font-size:.85rem}td{font-size:.92rem}.empty{text-align:center;padding:30px 20px}.empty p{margin-bottom:0}dl{margin:0;display:grid;gap:12px}dt{font-size:.82rem;color:var(--muted)}dd{margin:3px 0 0;font-weight:650}
dialog{width:min(480px,calc(100% - 30px));border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink)}dialog::backdrop{background:#0d2039aa}dialog dl{margin-bottom:20px}
@media(max-width:850px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.shell{display:block}aside{gap:16px;padding:16px}nav{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}nav button{padding:8px}.aside-case{display:none}}
@media(max-width:440px){.grid,.grid.three{grid-template-columns:1fr}}

label{display:grid;gap:5px;font-weight:650}input,select,textarea{width:100%;font:inherit;padding:8px;border:1px solid #b4c4d1;border-radius:5px;color:inherit;background:white}textarea{min-height:85px}.fields{display:grid;gap:14px;margin-bottom:18px}dialog{max-height:90vh;overflow:auto}video{width:100%;max-height:55vh;margin-bottom:12px}.entry{margin-bottom:16px;max-width:740px}.entry .fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));align-items:start}.entry textarea{min-height:76px}.casebar{margin-bottom:24px}.casebar p{margin:0}.error{color:#a42525}td button{white-space:nowrap}.intro{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.intro h1{margin:0}form .toolbar{margin-bottom:0}

[hidden]{display:none!important}.signin{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#26445e,#102139 65%)}.signin-card{width:min(100%,640px);padding:clamp(12px,4vw,36px);text-align:center}.department-brand{display:grid;justify-items:center;gap:8px;margin:0 auto 16px}.department-brand img{display:block;width:auto;height:94px;max-width:100%;object-fit:contain}.department-brand .muted{font-size:.875rem;margin:0}.signin h1{font-size:clamp(.7rem,3.6vw,1.7rem);white-space:nowrap;letter-spacing:-.025em}.signin form{width:min(100%,320px);margin:20px auto 0}.signin label{text-align:left}.signin .btn{width:100%;margin-top:10px}@media(max-width:400px){.signin{padding:10px}}.session{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

#workspace main,dialog{font-size:.75rem}#workspace main{padding-top:18px}.casebar{margin-bottom:14px}.intro{margin-bottom:10px}#workspace h1{font-size:1.5rem}#workspace h2,dialog h2{font-size:1rem}.entry{max-width:none;padding:12px}.fields,.entry .fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:8px 12px;margin-bottom:10px}.fields label{gap:3px}.fields input,.fields select,.fields textarea{padding:5px 6px}.fields textarea,.entry textarea{min-height:46px}.record th,.record td{font-size:inherit;padding:6px 8px}#workspace main .btn,dialog .btn{font-size:inherit;padding:5px 8px}dialog{width:min(760px,calc(100% - 24px))}dialog dl{grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:8px}dialog dt{font-size:inherit}
@page{margin:12mm}@media print{body:has(.exhibit-label) #workspace{display:none!important}dialog:has(.exhibit-label){position:static;width:100%;max-height:none;border:0;margin:0;padding:0}dialog:has(.exhibit-label)::backdrop{background:white}dialog:has(.exhibit-label) .toolbar{display:none}.exhibit-label{border:1px solid black;padding:12px;width:min(100%,105mm);font-size:9pt;break-inside:avoid}}
</style>
</head>

<script>
let learner=null,submitting=false,submitted=false;
const signIn=document.querySelector('#signin'), workspace=document.querySelector('#workspace');
const loginForm=document.querySelector('#login-form');
const loginStatus=document.querySelector('#signin-status');
const submitEvidence=document.querySelector('#submit-evidence');
const signOut=document.querySelector('#signout');
async function api(path,data){
  const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  const result=await res.json();
  if(!res.ok)throw new Error(result.error||'PEMS request failed.');
  return result;
}
loginForm.addEventListener('submit',async event=>{
  event.preventDefault();
  const submit=loginForm.querySelector('[type=submit]');
  if(submit.disabled)return;
  const input=loginForm.elements.student_id;
  const emiratesId=input.value.trim().replace(/[\s-]/g,'');
  if(!/^\d{15}$/.test(emiratesId)){
    input.setAttribute('aria-invalid','true');
    loginStatus.textContent='Enter exactly 15 digits. Do not include letters or other symbols.';
    input.focus();
    return;
  }
  input.removeAttribute('aria-invalid');
  loginStatus.textContent='';
  submit.disabled=true;
  try{
    learner=await api('/api/login',{emiratesId});
    submitted=false;
    submitEvidence.disabled=false;
    loginStatus.textContent='';
    loginForm.reset();
    document.querySelector('#signed-in-user').textContent=learner.name+' · '+learner.attempt;
    signIn.hidden=true;
    workspace.hidden=false;
    active='exhibit';
    message('');
    await refresh();
  }catch(error){loginStatus.textContent=error.message;}
  finally{submit.disabled=false;}
});
signOut.addEventListener('click',async ()=>{
  if(signOut.disabled)return;
  signOut.disabled=true;
  try{await api('/api/logout',{});}
  catch(error){message(error.message,true);signOut.disabled=false;return;}
  learner=null;
  ++renderVersion;
  records=[];
  ready=false;
  if(database)(await database.catch(()=>null))?.close();
  database=undefined;
  if(dialog.open)dialog.close();
  screen.replaceChildren();
  workspace.hidden=true;
  signIn.hidden=false;
  loginForm.querySelector('input').focus();
  signOut.disabled=false;
});
submitEvidence.addEventListener('click',async ()=>{
  if(!learner||!ready||submitting)return;
  submitting=true;
  submitEvidence.disabled=true;
  signOut.disabled=true;
  try{
    const saved=await transact('readonly',store=>store.getAll());
    if(!saved.length){message('Save at least one record before submitting.',true);return;}
    if(!window.confirm('Submit the saved records for this attempt?'))return;
    const result=await api('/api/submissions',{attempt:learner.attempt,records:saved});
    submitted=true;
    render();
    message('Submission received · '+result.attempt+' · '+enteredTime(result.submittedAt)+' · '+result.filename);
  }catch(error){message(error.message+' Your saved records are available to retry.',true);}
  finally{submitting=false;submitEvidence.disabled=submitted;signOut.disabled=false;}
});
const screens={
  exhibit:{title:'Evidence Register',action:'Add exhibit',empty:'No exhibits recorded',
    columns:['Reference','Description','Type','Found at','Recovered by','Recovered at','Current custody']},
  video:{title:'Video Recordings',action:'Log recording',empty:'No videos attached',
    columns:['Recording','Exhibit','File','Recorded by']},
  request:{title:'Specialist Coordination',action:'Log contact',empty:'No specialist contacts recorded',
    columns:['Exhibit','Unit contacted','Purpose of contact','Contact time','Recorded by']},
  transfer:{title:'Custody History',action:'Record transfer',empty:'No transfers recorded',
    columns:['Exhibit','Released by','Received by','Destination','Transfer time','Recorded by']}
};
const nav=document.querySelector('#nav'),screen=document.querySelector('#screen');
const dialog=document.querySelector('#editor'),body=document.querySelector('#dialog-body');
const notice=document.querySelector('#notice');
let active='exhibit',records=[],ready=false,objectUrl,renderVersion=0;
let database;
function openDatabase(){
return new Promise((resolve,reject)=>{
  const request=indexedDB.open('pems-attempt-'+learner.attempt,1);
  request.onupgradeneeded=()=>request.result.createObjectStore('records',{keyPath:'id',autoIncrement:true});
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error);
});
}
async function transact(mode,operation){
  const db=await (database??=openDatabase());
  return new Promise((resolve,reject)=>{
    const tx=db.transaction('records',mode);
    const request=operation(tx.objectStore('records'));
    tx.oncomplete=()=>resolve(request.result);
    tx.onabort=()=>reject(tx.error);
  });
}
const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const timestamp=value=>value?new Date(value).toLocaleString():'';
const exhibits=()=>records.filter(record=>record.kind==='exhibit');
const ref=id=>id?'EX-'+String(id).padStart(3,'0'):'Case';
const movements=id=>records.filter(r=>r.kind==='transfer'&&r.exhibit===id).sort((a,b)=>a.time.localeCompare(b.time)||a.id-b.id);
const custody=id=>movements(id).at(-1);
const currentCustody=(r,latest)=>latest?latest.to+' · '+latest.destination:(r.initialStorage||r.officer);
const details=values=>`<dl>${values.filter(([,value])=>value).map(([label,value])=>`<div><dt>${escape(label)}</dt><dd>${escape(value)}</dd></div>`).join('')}</dl>`;
const localTime=value=>value?value.replace('T',' ')+' (GST, UTC+4)':'';
const enteredTime=value=>value?new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Dubai',dateStyle:'short',timeStyle:'medium',hourCycle:'h23'}).format(new Date(value))+' GST':'';
const button=(label,attribute,value='',primary=false)=>`<button type="button" class="btn ${primary?'primary':''}" data-${attribute}="${escape(value)}">${escape(label)}</button>`;
const message=(text,error=false)=>{
  notice.hidden=!text;
  notice.textContent=text;
  notice.classList.toggle('error',error);
};
function row(r){
  switch(r.kind){
    case 'exhibit':{
      const latest=custody(r.id);
      return [button(ref(r.id),'detail',r.id),escape(r.description),escape(r.type),escape(r.location),escape(r.recoveredBy||r.officer),escape(localTime(r.time)),escape(currentCustody(r,latest))];
    }
    case 'video':return [button(r.description,'play',r.id),ref(r.exhibit),escape(r.filename||r.file?.name),escape(r.officer)];
    case 'request':return [button(ref(r.exhibit),'detail',r.exhibit),escape(r.specialism),button(r.description,'contact',r.id),escape(timestamp(r.time)),escape(r.officer)];
    case 'transfer':return [button(ref(r.exhibit),'detail',r.exhibit),escape(r.from),escape(r.to),escape(r.destination),button(localTime(r.time),'movement',r.id),escape(r.officer||r.from)];
  }
}
function render(){
  const current=screens[active];
  nav.innerHTML=Object.entries(screens).map(([key,value])=>`<button type="button" data-nav="${key}" ${key===active?'aria-current="page"':''}>${value.title}</button>`).join('');
  const rows=records.filter(r=>r.kind===active).map(row);
  screen.innerHTML=`<div class="intro"><h1>${current.title}</h1>${ready&&!submitted&&rows.length?button(current.action,'add',active,true):''}</div>`+
    (ready&&!submitted&&!rows.length?
      `<section class="card entry"><h2>${current.action}</h2>${recordForm(active)}</section>`:'')+
    (rows.length?`<div class="record"><table aria-label="${current.title}"><thead><tr>${current.columns.map(c=>`<th scope="col">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:
    `<div class="card empty">${ready?current.empty:'Records are unavailable'}</div>`);
}
function open(title,markup){
  document.querySelector('#dialog-title').textContent=title;
  body.innerHTML=markup;
  if(!dialog.open)dialog.showModal();
  body.querySelector('input, select, textarea, button')?.focus();
}
const input=(label,name,type='text',value='',required=true)=>`<label>${label}<input name="${name}" type="${type}" value="${escape(value)}" ${required?'required':''}></label>`;
const notes=(label,name,required=false)=>`<label>${label}<textarea name="${name}" ${required?'required':''}></textarea></label>`;
const select=(label,name,options)=>`<label>${label}<select name="${name}" required><option value="">Select</option>${options.map(([value,text])=>`<option value="${escape(value)}">${escape(text)}</option>`).join('')}</select></label>`;
const fields=(kind,id)=>{
  const officer=`<label>Recorded by<input value="${escape(learner?.name)}" readonly></label>`;
  const options=exhibits().map(r=>[r.id,ref(r.id)+' · '+r.description]);
  const linked=id?`<input type="hidden" name="exhibit" value="${id}"><p><strong>Exhibit</strong> ${ref(id)}</p>`:
    select(kind==='video'?'Link to':'Exhibit','exhibit',kind==='video'?[['case','Case TR-2026-014'],...options]:options);
  switch(kind){
    case 'exhibit':return input('Description','description')+select('Evidence type','type',['Biological','Digital','Trace','Physical','Other'].map(type=>[type,type]))+
      input('Exact recovery location','location')+input('Recovery date and time (GST)','time','datetime-local')+
      input('Recovered by','recoveredBy','text',learner?.name)+input('Recovery method','recoveryMethod')+
      input('Condition on recovery','condition')+input('Identifying marks or serial number (if applicable)','identifier','text','',false)+
      input('Packaging type','packaging')+input('Package reference','packageRef')+input('Seal reference','seal')+
      input('Packaged and sealed by','packagedBy','text',learner?.name)+input('Initial storage location','initialStorage')+
      input('Photo or diagram reference (if used)','mediaRef','text','',false)+officer+notes('Notes','notes');
    case 'video':return linked+input('Recording title','description')+input('Device or serial reference','device')+
      input('Purpose','purpose')+input('Recording location','location')+
      input('Recording start (GST)','start','datetime-local')+input('Recording end (GST)','end','datetime-local')+
      input('Stored filename','filename')+input('Designated storage location','storage')+
      input('Storage transfer date and time (GST)','time','datetime-local')+
      input('Transferred to storage by','storedBy','text',learner?.name)+officer;
    case 'request':return linked+input('Unit contacted','specialism')+input('Person contacted','person')+
      input('Contact date and time','time','datetime-local')+notes('Purpose of contact','description',true)+
      notes('Advice or instructions received (if any)','advice')+notes('Agreed follow-up actions (if any)','followup')+officer;
    case 'transfer':return linked+input('Released by','from','text',id?(custody(id)?.to??exhibits().find(r=>r.id===id)?.officer):'')+
      input('Received by','to')+input('Origin','origin','text',id?(custody(id)?.destination||exhibits().find(r=>r.id===id)?.initialStorage||''):'')+
      input('Destination','destination')+input('Transfer date and time (GST)','time','datetime-local')+
      input('Purpose of transfer','purpose')+input('Seal condition at handover','sealCondition')+
      select('Receiver acknowledgement','ack',[['Confirmed','Confirmed'],['Pending','Pending'],['Exception recorded','Exception recorded']])+
      officer+notes('Handover notes or exceptions','notes');
  }
};
function recordForm(kind,id,modal=false){
  const needsExhibit=(kind==='request'||kind==='transfer')&&!exhibits().length;
  const guidance=needsExhibit?`<p class="muted">Save an exhibit in the Evidence Register before saving this record.</p>`:'';
  return `<form data-kind="${kind}">${guidance}<div class="fields">${fields(kind,id)}</div><p class="error" role="alert" hidden></p>
    <div class="toolbar"><button class="btn primary" type="submit" ${needsExhibit?'disabled':''}>${kind==='video'?'Save recording log':'Save record'}</button>${modal?button('Cancel','close'):''}</div></form>`;
}
function edit(kind,id){
  if(submitted){message('This attempt has already been submitted.');return;}
  if((kind==='request'||kind==='transfer')&&!exhibits().length){
    message('Add an exhibit before logging specialist contact or recording a transfer.');
    return;
  }
  open(screens[kind].action,recordForm(kind,id,true));
}
function showExhibit(id){
  const r=exhibits().find(item=>item.id===id);
  const latest=custody(id);
  const values=[['Evidence type',r.type],['Exact recovery location',r.location],['Recovered at',localTime(r.time)],
    ['Recovered by',r.recoveredBy||r.officer],['Recovery method',r.recoveryMethod],['Condition on recovery',r.condition],
    ['Identifying marks or serial number',r.identifier],['Packaging type',r.packaging],['Package reference',r.packageRef],
    ['Seal reference',r.seal],['Packaged and sealed by',r.packagedBy],['Initial storage',r.initialStorage],
    ['Current custody',currentCustody(r,latest)],['Photo or diagram reference',r.mediaRef],['Recorded by',r.officer],['Notes',r.notes]];
  const history=movements(id);
  open(ref(id)+' · '+r.description,details(values)+`<h3>Custody history</h3>`+
    (history.length?`<ol>${history.map(move=>`<li>${button(localTime(move.time),'movement',move.id)} ${escape(move.from)} → ${escape(move.to)} · ${escape(move.destination)}</li>`).join('')}</ol>`:'<p>No transfers recorded.</p>')+
    `<div class="toolbar">${button('Exhibit label','label',id)}${button('Log recording','linked','video:'+id)}${button('Log specialist contact','linked','request:'+id)}${button('Record transfer','linked','transfer:'+id)}${button('Close','close')}</div>`);
}
function showLabel(id){
  const r=exhibits().find(item=>item.id===id);
  open('Training exhibit label',`<section class="exhibit-label"><strong>TR-2026-014 · ${ref(id)}</strong>`+
    details([['Description',r.description],['Recovery location',r.location],['Recovered at',localTime(r.time)],
      ['Recovered by',r.recoveredBy||r.officer],['Package',r.packageRef],['Seal',r.seal]])+
    `</section><div class="toolbar">${button('Print label','print')}${button('Back to exhibit','detail',id)}${button('Close','close')}</div>`);
}
function showMovement(id){
  const r=records.find(item=>item.id===id);
  open('Custody transfer · '+ref(r.exhibit),details([['Released by',r.from],['Received by',r.to],['Origin',r.origin],
    ['Destination',r.destination],['Transfer time',localTime(r.time)],['Purpose',r.purpose],['Seal condition',r.sealCondition],
    ['Receiver acknowledgement (recorded)',r.ack],['Recorded by',r.officer||r.from],['Entry time',enteredTime(r.recordedAt)],['Notes',r.notes]])+
    `<div class="toolbar">${button('Open exhibit','detail',r.exhibit)}${button('Close','close')}</div>`);
}
function showContact(id){
  const r=records.find(item=>item.id===id);
  const values=[['Exhibit',ref(r.exhibit)],['Unit contacted',r.specialism],['Person contacted',r.person],
    ['Contact time',timestamp(r.time)],['Purpose of contact',r.description],['Advice or instructions received',r.advice],
    ['Agreed follow-up actions',r.followup],['Recorded by',r.officer],['Student ID',r.studentId]];
  open('Specialist contact',`<dl>${values.filter(([,value])=>value).map(([label,value])=>`<div><dt>${label}</dt><dd>${escape(value)}</dd></div>`).join('')}</dl>${button('Close','close')}`);
}
document.addEventListener('click',event=>{
  const b=event.target.closest('button');
  if(!b)return;
  const d=b.dataset;
  if(d.nav){active=d.nav;message('');render();nav.querySelector('[aria-current]').focus();}
  if(d.add)edit(d.add);
  if(d.detail)showExhibit(Number(d.detail));
  if(d.contact)showContact(Number(d.contact));
  if(d.linked){const [kind,id]=d.linked.split(':');edit(kind,Number(id));}
  if(d.label)showLabel(Number(d.label));
  if('print' in d)window.print();
  if(d.movement)showMovement(Number(d.movement));
  if(d.play){
    const r=records.find(item=>item.id===Number(d.play));
    if(r.file)objectUrl=URL.createObjectURL(r.file);
    open(r.description,details([['Link',ref(r.exhibit)],['Device reference',r.device],['Purpose',r.purpose],
      ['Recording location',r.location],['Recording start',localTime(r.start)],['Recording end',localTime(r.end)],
      ['Stored filename',r.filename||r.file?.name],['Storage location',r.storage],['Storage transfer time',localTime(r.time)],
      ['Transferred by',r.storedBy],['Recorded by',r.officer]])+
      (objectUrl?`<video controls preload="metadata" src="${objectUrl}"></video><a href="${objectUrl}" download="${escape(r.file.name)}">Download preview video</a> `:'')+
      button('Close','close'));
  }
  if('close' in d&&!dialog.querySelector('[type=submit]:disabled'))dialog.close();
});
dialog.addEventListener('cancel',event=>{
  if(dialog.querySelector('[type=submit]:disabled'))event.preventDefault();
});
dialog.addEventListener('close',()=>{
  if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=undefined;}
  if(!dialog.open)body.replaceChildren();
});
document.addEventListener('submit',async event=>{
  const form=event.target;
  if(!form.dataset.kind)return;
  event.preventDefault();
  if(!learner||submitting||submitted)return;
  const save=form.querySelector('[type=submit]'),error=form.querySelector('[role=alert]');
  if(save.disabled)return;
  const entry=Object.fromEntries(new FormData(form));
  for(const key of Object.keys(entry)){
    if(typeof entry[key]==='string')entry[key]=entry[key].trim();
  }
  if([...form.querySelectorAll('[required]')].some(field=>entry[field.name]==='')){
    error.textContent='Complete all required fields.';error.hidden=false;return;
  }
  if(entry.start&&entry.end&&entry.end<entry.start){
    error.textContent='Recording end must be at or after recording start.';error.hidden=false;return;
  }
  if(entry.end&&entry.time<entry.end){
    error.textContent='Storage transfer must be at or after recording end.';error.hidden=false;return;
  }
  if(entry.file&&!entry.file.size)delete entry.file;
  if(entry.file&&(!(entry.file.type.startsWith('video/')||(!entry.file.type&&/\.(mp4|webm|mov)$/i.test(entry.file.name))))){
    error.textContent='Choose a video file.';error.hidden=false;return;
  }
  entry.kind=form.dataset.kind;
  entry.officer=learner.name;
  entry.recordedAt=new Date().toISOString();
  if(entry.exhibit)entry.exhibit=entry.exhibit==='case'?null:Number(entry.exhibit);
  if((entry.kind==='request'||entry.kind==='transfer')&&!exhibits().some(exhibit=>exhibit.id===entry.exhibit)){
    error.textContent='Select a saved exhibit.';error.hidden=false;return;
  }
  save.disabled=true;
  signOut.disabled=true;
  submitEvidence.disabled=true;
  try{
    await transact('readwrite',store=>store.add(entry));
  }catch{
    error.textContent='The record could not be saved. Check available browser storage and try again.';
    error.hidden=false;save.disabled=false;return;
  }finally{signOut.disabled=false;submitEvidence.disabled=false;}
  if(dialog.contains(form))dialog.close();
  if(!learner)return;
  active=entry.kind;
  await refresh();
  if(ready){message('Record saved.');screen.querySelector('[data-add]')?.focus();}
});
async function refresh(){
  const version=++renderVersion;
  try{
    const all=await transact('readonly',store=>store.getAll());
    if(version!==renderVersion)return;
    records=all;ready=true;render();
  }catch{
    if(version!==renderVersion)return;
    ready=false;render();message('Browser storage is unavailable. Open the simulator in a browser tab with local storage enabled.',true);
  }
}
window.addEventListener('focus',()=>{
  if(learner&&!dialog.open&&!screen.querySelector('form'))refresh();
});
</script>
